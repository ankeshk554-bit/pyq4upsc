name: Browser compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tablet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test iPad layouts and study flow
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_URL: http://127.0.0.1:8000
        run: |
          python server.py > /tmp/upsc-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000', timeout=1) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Development server did not start')
          PY
          python tests/tablet_smoke.py
          python tests/tutor_reliability_smoke.py
          python tests/followup_smoke.py

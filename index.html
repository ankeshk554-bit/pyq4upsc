<!DOCTYPE html>
<html lang="en" data-theme="amoled">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UPSC Vault</title>
  <script defer src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #000;
      --card: #0a0a0a;
      --text: #e5e7eb;
      --muted: rgba(255,255,255,0.65);
      --border: #1f2937;
      --accent: #3b82f6;
      --good: #10b981;
      --bad: #f43f5e;
      --mark: #a855f7;
      --chip: #111827;
      --shadow: rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; }
    body { min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar { width: 310px; background: var(--bg); border-right: 1px solid var(--border); padding: 18px 16px; overflow-y: auto; }
    .main { flex: 1; padding: 16px 18px 28px; overflow-y: auto; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; box-shadow: 0 10px 24px var(--shadow); }
    .row { display: flex; align-items: center; gap: 10px; }
    .wrap { flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .accent { color: var(--accent); }
    .badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: rgba(255,255,255,0.02); border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .badge.good { color: var(--good); border-color: rgba(16,185,129,.5); background: rgba(16,185,129,.08); }
    .badge.bad { color: var(--bad); border-color: rgba(244,63,94,.5); background: rgba(244,63,94,.08); }
    .badge.marked { color: var(--mark); border-color: rgba(168,85,247,.5); background: rgba(168,85,247,.08); }
    .chip { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--chip); color: var(--text); border-radius: 999px; padding: 7px 12px; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; user-select: none; }
    .chip.active { background: var(--accent); border-color: var(--accent); color: white; }
    input[type="search"], input[type="text"], select, textarea {
      width: 100%; background: rgba(255,255,255,0.02); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px; outline: none;
    }
    textarea { resize: vertical; min-height: 90px; }
    button { background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.danger { background: var(--bad); color: white; border-color: var(--bad); }
    .questions { display: grid; gap: 18px; }
    .question-card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 22px; box-shadow: 0 12px 22px rgba(0,0,0,0.18); }
    .question-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .question-stem { font-size: 1.03rem; line-height: 1.7; white-space: pre-wrap; margin: 0 0 16px; }
    .options { display: grid; gap: 10px; }
    .option { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.015); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; color: var(--text); }
    .option.correct { border-color: rgba(16,185,129,0.8); background: rgba(16,185,129,0.08); }
    .option.wrong { border-color: rgba(244,63,94,0.8); background: rgba(244,63,94,0.08); }
    .option.selected { box-shadow: 0 0 0 1px var(--accent); }
    .letter { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.04); border: 1px solid var(--border); font-size: 11px; font-weight: 800; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .notes { display: none; margin-top: 14px; }
    .notes.open { display: block; }
    .q-image { max-width: 100%; border-radius: 14px; border: 1px solid var(--border); margin-top: 12px; }
    .empty { border: 1px dashed var(--border); border-radius: 18px; padding: 32px 20px; text-align: center; color: var(--muted); }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .stat { min-width: 110px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,255,255,0.02); }
    .stat strong { display: block; font-size: 1.1rem; }
    .stat small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .app-shell { display: block; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .main { padding-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="panel" style="margin-bottom:14px;">
        <div class="row wrap" style="justify-content:space-between; margin-bottom: 12px;">
          <strong style="font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent);">UPSC Vault</strong>
          <button id="theme-toggle" type="button" aria-label="Toggle theme">Theme</button>
        </div>
        <div class="toolbar">
          <button id="sample-load" class="primary">Load Demo</button>
          <button id="csv-import" type="button">Import CSV</button>
          <input id="csv-upload" class="hidden" type="file" accept=".csv" />
        </div>
      </div>

      <div class="panel" style="margin-bottom:14px;">
        <div class="muted" style="font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px;">Filters</div>
        <input id="search-input" type="search" placeholder="Search questions..." aria-label="Search questions" />
        <div class="toolbar" style="margin-top:12px;">
          <button id="marked-filter" type="button">Marked</button>
          <button id="notes-filter" type="button">Notes</button>
        </div>
        <div id="year-chips" class="row wrap" style="gap:8px; margin-top:12px;"></div>
        <div id="subject-chips" class="row wrap" style="gap:8px; margin-top:12px;"></div>
        <button id="reset-filters" type="button" style="margin-top:12px; width:100%;">Reset Filters</button>
      </div>

      <div class="panel" style="margin-bottom:14px;">
        <div class="muted" style="font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px;">Progress</div>
        <div id="stats-summary" class="stats"></div>
      </div>

      <div class="panel">
        <div class="muted" style="font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px;">Attempt History</div>
        <div id="history-list"></div>
      </div>
    </aside>

    <main class="main">
      <div id="stats-bar" class="stats"></div>
      <div id="questions" class="questions"></div>
    </main>
  </div>

  <script>
    const STORAGE_KEYS = {
      bank: 'uv_bank_v2',
      progress: 'uv_progress_v2',
      history: 'uv_history_v2',
      theme: 'uv_theme_v2'
    };

    const SAMPLE_QUESTIONS = [
      { id: 'demo-q-1', subject: 'Polity', year: 2024, question: 'Which article of the Constitution abolishes untouchability? (a) 15 (b) 17 (c) 21 (d) 24', ans: 'b' },
      { id: 'demo-q-2', subject: 'Geography', year: 2024, question: 'The Tropic of Cancer passes through which state? (a) Kerala (b) Gujarat (c) Tamil Nadu (d) Assam', ans: 'b' },
      { id: 'demo-q-3', subject: 'Economy', year: 2023, question: 'Repo rate is the rate at which (a) public borrows from RBI (b) RBI lends to commercial banks (c) banks lend to public (d) government borrows from world bank', ans: 'b' },
      { id: 'demo-q-4', subject: 'History', year: 2023, question: 'The Non-Cooperation Movement was launched in (a) 1919 (b) 1920 (c) 1922 (d) 1930', ans: 'b' },
      { id: 'demo-q-5', subject: 'Environment', year: 2022, question: 'Which gas is greenhouse gas? (a) Nitrogen (b) Methane (c) Oxygen (d) Argon', ans: 'b' },
      { id: 'demo-q-6', subject: 'Science', year: 2022, question: 'Age of fossils is measured by (a) spectroscopy (b) carbon dating (c) chromatography (d) electroporation', ans: 'b' },
      { id: 'demo-q-7', subject: 'Polity', year: 2021, question: 'Fundamental Duties were added by which amendment? (a) 42nd (b) 44th (c) 48th (d) 52nd', ans: 'a' },
      { id: 'demo-q-8', subject: 'Geography', year: 2021, question: 'Which river does not originate in India? (a) Godavari (b) Brahmaputra (c) Narmada (d) Kaveri', ans: 'b' },
      { id: 'demo-q-9', subject: 'Agriculture', year: 2020, question: 'Green Revolution is chiefly associated with (a) afforestation (b) high-yield seeds and irrigation (c) railways (d) mining', ans: 'b' },
      { id: 'demo-q-10', subject: 'History', year: 2019, question: 'Who founded the Indian National Congress? (a) Bal Gangadhar Tilak (b) A.O. Hume (c) Gandhi (d) Nehru', ans: 'b' }
    ];

    let allQuestions = [];
    let currentSet = [];
    let activeYears = new Set();
    let activeSubjects = new Set();
    let filterMarkedOnly = false;
    let filterNotesOnly = false;
    let progress = {};
    let history = [];
    let themeIndex = 0;
    const themes = ['amoled', 'nord', 'solarized', 'white', 'paper'];

    function safeGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }
    function safeSet(key, value) {
      try { localStorage.setItem(key, value); return true; } catch { return false; }
    }

    function escapeHtml(s = '') {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function debounce(fn, delay = 180) {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    function hashQuestion(text, subject, year) {
      const source = `${subject || 'General'}|${year || 0}|${text || ''}`;
      let h = 2166136261;
      for (let i = 0; i < source.length; i++) {
        h ^= source.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return `q_${(h >>> 0).toString(36)}`;
    }

    function normalizeQuestion(q) {
      const subject = String(q.subject || 'General').trim();
      const year = Number(q.year || 0);
      const question = String(q.question || '').trim();
      const ans = String(q.ans || '').trim().toLowerCase();
      const id = q.id || hashQuestion(question, subject, year);
      return { ...q, id, subject, year, question, ans, _search: `${subject} ${question}`.toLowerCase() };
    }

    function loadBank() {
      const raw = safeGet(STORAGE_KEYS.bank);
      if (!raw) {
        allQuestions = SAMPLE_QUESTIONS.map(normalizeQuestion);
        return;
      }
      try {
        const parsed = JSON.parse(raw) || [];
        allQuestions = parsed.map(normalizeQuestion);
      } catch {
        allQuestions = SAMPLE_QUESTIONS.map(normalizeQuestion);
      }
    }

    function loadProgress() {
      try { progress = JSON.parse(safeGet(STORAGE_KEYS.progress) || '{}'); } catch { progress = {}; }
    }

    function loadHistory() {
      try { history = JSON.parse(safeGet(STORAGE_KEYS.history) || '[]'); } catch { history = []; }
    }

    function saveBank() {
      safeSet(STORAGE_KEYS.bank, JSON.stringify(allQuestions.map(q => ({ ...q, _search: undefined }))));
    }
    const saveProgress = debounce(() => { safeSet(STORAGE_KEYS.progress, JSON.stringify(progress)); }, 220);
    const saveHistory = debounce(() => { safeSet(STORAGE_KEYS.history, JSON.stringify(history)); }, 220);

    function setTheme(name) {
      const list = ['amoled', 'nord', 'solarized', 'white', 'paper'];
      const chosen = list.includes(name) ? name : 'amoled';
      document.documentElement.setAttribute('data-theme', chosen);
      document.body.dataset.theme = chosen;
      safeSet(STORAGE_KEYS.theme, chosen);
    }

    function bindTheme() {
      const saved = safeGet(STORAGE_KEYS.theme) || 'amoled';
      setTheme(saved);
      themeIndex = themes.indexOf(saved);
      document.getElementById('theme-toggle').addEventListener('click', () => {
        themeIndex = (themeIndex + 1) % themes.length;
        setTheme(themes[themeIndex]);
      });
    }

    function buildStatsSummary() {
      const entries = Object.values(progress);
      const seen = entries.filter(e => e && (e.selected !== undefined || e.revealed)).length;
      const attempted = entries.filter(e => e && e.selected !== undefined).length;
      const correct = entries.filter(e => e && e.correct === true).length;
      const notes = entries.filter(e => e && typeof e.note === 'string' && e.note.trim()).length;
      const marked = entries.filter(e => e && e.marked).length;
      const accuracy = attempted ? Math.round((correct / attempted) * 100) : 0;
      const root = document.getElementById('stats-summary');
      root.innerHTML = `
        <div class="stat"><strong>${seen}</strong><small>Seen</small></div>
        <div class="stat"><strong>${accuracy}%</strong><small>Accuracy</small></div>
        <div class="stat"><strong>${marked}</strong><small>Marked</small></div>
        <div class="stat"><strong>${notes}</strong><small>Notes</small></div>
      `;
    }

    function renderHistory() {
      const box = document.getElementById('history-list');
      if (!history.length) {
        box.innerHTML = '<div class="muted">No completed tests yet.</div>';
        return;
      }
      box.innerHTML = history.slice(0, 6).map(item => `
        <div style="display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border);">
          <div>
            <div style="font-size:12px; font-weight:700;">Test ${item.testId || 'N/A'}</div>
            <div class="muted" style="font-size:11px;">${new Date(item.date).toLocaleDateString()}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:12px; font-weight:700; color: var(--accent);">${item.score}</div>
            <div class="muted" style="font-size:11px;">${item.accuracy}%</div>
          </div>
        </div>
      `).join('');
    }

    function createQuestionCard(q, index) {
      const state = progress[q.id] || {};
      const isAnswered = state.selected !== undefined || state.revealed;
      const isMarked = !!state.marked;
      const hasNote = !!(state.note && String(state.note).trim());
      const image = state.image || '';
      const isCorrect = state.correct === true;
      const isWrong = state.correct === false;

      let stem = q.question;
      const parts = stem.split(/\(([a-d])\)/g);
      const text = escapeHtml(parts[0] || '');
      const options = [];
      for (let i = 1; i < parts.length; i += 2) {
        options.push({ letter: parts[i], text: escapeHtml(parts[i + 1] || '') });
      }

      const optionMarkup = options.map(opt => {
        let classes = 'option';
        if (isAnswered) {
          classes += ' selected';
          if (state.selected === opt.letter && state.correct === true) classes += ' correct';
          if (state.selected === opt.letter && state.correct === false) classes += ' wrong';
          if (q.ans === opt.letter && !state.correct) classes += ' correct';
        }
        return `
          <button class="${classes}" data-qid="${q.id}" data-choice="${opt.letter}" type="button">
            <span class="letter">${opt.letter.toUpperCase()}</span>
            <span>${opt.text}</span>
          </button>
        `;
      }).join('');

      return `
        <article class="question-card" data-qid="${q.id}">
          <div class="question-head">
            <div class="row wrap" style="gap:8px;">
              <span class="badge">${escapeHtml(q.year || 'N/A')}</span>
              <span class="badge">${escapeHtml(q.subject || 'General')}</span>
              ${isMarked ? '<span class="badge marked">Marked</span>' : ''}
              ${isAnswered ? `<span class="badge ${state.correct ? 'good' : 'bad'}">${state.correct ? 'Correct' : 'Wrong'}</span>` : ''}
              ${hasNote ? '<span class="badge">Note</span>' : ''}
            </div>
            <strong class="muted">Q${index + 1}</strong>
          </div>
          <div class="question-stem">${text}</div>
          <div class="options">${optionMarkup}</div>
          ${image ? `<img class="q-image" src="${image}" alt="Question illustration" />` : ''}
          <div class="notes ${hasNote ? 'open' : ''}">
            <textarea data-note-id="${q.id}" placeholder="Add your notes here...">${escapeHtml(state.note || '')}</textarea>
          </div>
          <div class="actions">
            <button type="button" data-action="reveal" data-qid="${q.id}">Reveal</button>
            <button type="button" data-action="toggle-mark" data-qid="${q.id}">${isMarked ? 'Unmark' : 'Mark'}</button>
            <button type="button" data-action="toggle-note" data-qid="${q.id}">${hasNote ? 'Hide note' : 'Add note'}</button>
            <button type="button" data-action="attach" data-qid="${q.id}">Attach image</button>
            <input type="file" class="hidden" accept="image/*" data-upload-id="${q.id}" />
          </div>
        </article>
      `;
    }

    function renderQuestions() {
      const container = document.getElementById('questions');
      if (!currentSet.length) {
        container.innerHTML = '<div class="empty">No questions match the current filters.</div>';
        return;
      }
      container.innerHTML = currentSet.map(createQuestionCard).join('');
      bindQuestionEvents();
    }

    function updateStatsBar() {
      const root = document.getElementById('stats-bar');
      root.innerHTML = `
        <div class="stat"><strong>${allQuestions.length}</strong><small>Bank</small></div>
        <div class="stat"><strong>${currentSet.length}</strong><small>Visible</small></div>
        <div class="stat"><strong>${Object.values(progress).filter(v => v && v.selected !== undefined).length}</strong><small>Answered</small></div>
      `;
    }

    function renderFilters() {
      const years = [...new Set(allQuestions.map(q => q.year))].sort((a, b) => b - a);
      const subjects = [...new Set(allQuestions.map(q => q.subject))].sort();
      const yearBox = document.getElementById('year-chips');
      const subjectBox = document.getElementById('subject-chips');

      yearBox.innerHTML = years.map(year => `
        <button type="button" class="chip ${activeYears.has(year) ? 'active' : ''}" data-year="${year}">${year}</button>
      `).join('');

      subjectBox.innerHTML = subjects.map(subject => `
        <button type="button" class="chip ${activeSubjects.has(subject) ? 'active' : ''}" data-subject="${escapeHtml(subject)}">${escapeHtml(subject)}</button>
      `).join('');

      const markedBtn = document.getElementById('marked-filter');
      const notesBtn = document.getElementById('notes-filter');
      markedBtn.classList.toggle('active', filterMarkedOnly);
      notesBtn.classList.toggle('active', filterNotesOnly);
    }

    function applyFilters() {
      const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
      currentSet = allQuestions.filter(item => {
        if (activeYears.size && !activeYears.has(item.year)) return false;
        if (activeSubjects.size && !activeSubjects.has(item.subject)) return false;
        if (filterMarkedOnly && !(progress[item.id] && progress[item.id].marked)) return false;
        if (filterNotesOnly && !(progress[item.id] && String(progress[item.id].note || '').trim())) return false;
        if (q && !item._search.includes(q)) return false;
        return true;
      });
      renderQuestions();
      updateStatsBar();
    }

    const debouncedFilter = debounce(applyFilters, 200);

    function bindQuestionEvents() {
      document.querySelectorAll('[data-action="toggle-mark"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.dataset.qid;
          progress[qid] = progress[qid] || {};
          progress[qid].marked = !progress[qid].marked;
          saveProgress();
          buildStatsSummary();
          renderQuestions();
        });
      });

      document.querySelectorAll('[data-action="toggle-note"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.dataset.qid;
          const card = btn.closest('.question-card');
          const notes = card.querySelector('.notes');
          notes.classList.toggle('open');
        });
      });

      document.querySelectorAll('[data-action="reveal"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.dataset.qid;
          progress[qid] = progress[qid] || {};
          progress[qid].revealed = true;
          saveProgress();
          renderQuestions();
        });
      });

      document.querySelectorAll('[data-action="attach"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const qid = btn.dataset.qid;
          const input = document.querySelector(`input[data-upload-id="${qid}"]`);
          input?.click();
        });
      });

      document.querySelectorAll('input[data-upload-id]').forEach(input => {
        input.addEventListener('change', async (event) => {
          const file = event.target.files[0];
          if (!file || !file.type.startsWith('image/')) return;
          const dataUrl = await compressImage(file);
          const qid = input.dataset.uploadId;
          progress[qid] = progress[qid] || {};
          progress[qid].image = dataUrl;
          saveProgress();
          renderQuestions();
        });
      });

      document.querySelectorAll('textarea[data-note-id]').forEach(text => {
        text.addEventListener('input', () => {
          const qid = text.dataset.noteId;
          progress[qid] = progress[qid] || {};
          progress[qid].note = text.value;
          saveProgress();
          buildStatsSummary();
        });
      });

      document.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          const { qid, choice } = btn.dataset;
          const question = allQuestions.find(q => q.id === qid);
          if (!question) return;
          progress[qid] = progress[qid] || {};
          progress[qid].selected = choice;
          progress[qid].correct = choice === question.ans;
          progress[qid].updatedAt = Date.now();
          saveProgress();
          renderQuestions();
        });
      });
    }

    function compressImage(file, maxWidth = 1200, quality = 0.82) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function bindFilterEvents() {
      document.getElementById('search-input').addEventListener('input', debouncedFilter);
      document.getElementById('marked-filter').addEventListener('click', () => {
        filterMarkedOnly = !filterMarkedOnly;
        applyFilters();
      });
      document.getElementById('notes-filter').addEventListener('click', () => {
        filterNotesOnly = !filterNotesOnly;
        applyFilters();
      });
      document.getElementById('reset-filters').addEventListener('click', () => {
        activeYears = new Set();
        activeSubjects = new Set();
        filterMarkedOnly = false;
        filterNotesOnly = false;
        document.getElementById('search-input').value = '';
        renderFilters();
        applyFilters();
      });

      document.getElementById('year-chips').addEventListener('click', event => {
        const btn = event.target.closest('[data-year]');
        if (!btn) return;
        const year = Number(btn.dataset.year);
        if (activeYears.has(year)) activeYears.delete(year); else activeYears.add(year);
        renderFilters();
        applyFilters();
      });

      document.getElementById('subject-chips').addEventListener('click', event => {
        const btn = event.target.closest('[data-subject]');
        if (!btn) return;
        const subject = btn.dataset.subject;
        if (activeSubjects.has(subject)) activeSubjects.delete(subject); else activeSubjects.add(subject);
        renderFilters();
        applyFilters();
      });

      document.getElementById('sample-load').addEventListener('click', () => {
        allQuestions = SAMPLE_QUESTIONS.map(normalizeQuestion);
        saveBank();
        renderFilters();
        applyFilters();
      });

      document.getElementById('csv-import').addEventListener('click', () => {
        document.getElementById('csv-upload').click();
      });

      document.getElementById('csv-upload').addEventListener('change', async event => {
        const file = event.target.files[0];
        if (!file) return;
        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: results => {
            const rows = results.data.filter(row => row.Question && String(row.Question).trim());
            allQuestions = rows.map((row, index) => normalizeQuestion({
              id: hashQuestion(String(row.Question), String(row.Subject || 'General'), Number(row.Year || 0)),
              question: String(row.Question || ''),
              subject: String(row.Subject || 'General'),
              year: Number(row.Year || 0),
              ans: String(row['Official Answer Key'] || '').toLowerCase().replace(/[^a-d]/g, '')
            }));
            saveBank();
            renderFilters();
            applyFilters();
            event.target.value = '';
          }
        });
      });
    }

    function bindResize() {
      const panel = document.querySelector('.sidebar');
      if (!panel) return;
      let dragging = false;
      let raf = null;
      document.addEventListener('pointerdown', event => {
        if (window.innerWidth <= 900) return;
        if (event.target.closest('.sidebar')) return;
        dragging = true;
      });
      document.addEventListener('pointermove', event => {
        if (!dragging) return;
        if (window.innerWidth <= 900) return;
        if (raf) return;
        raf = requestAnimationFrame(() => {
          const width = Math.min(420, Math.max(240, window.innerWidth - event.clientX));
          panel.style.width = `${width}px`;
          raf = null;
        });
      });
      document.addEventListener('pointerup', () => { dragging = false; });
    }

    function boot() {
      loadBank();
      loadProgress();
      loadHistory();
      bindTheme();
      bindFilterEvents();
      bindResize();
      renderFilters();
      applyFilters();
      buildStatsSummary();
      renderHistory();
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>

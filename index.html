<!DOCTYPE html>
<html lang="en" data-theme="amoled">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPSC Vault | V60.0 Cost Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* STABLE THEMES FROM SOURCE */
        [data-theme="amoled"] { --bg: #000000; --card: #000000; --text: #f1f5f9; --border: #1e293b; --accent: #3b82f6; --input: #0a0a0a; --thought: #111827; }
        [data-theme="sepia"] { --bg: #f4ecd8; --card: #fdf6e3; --text: #5b4636; --border: #d3c6aa; --accent: #b58900; --input: #eee8d5; --thought: #efe1c0; }
        [data-theme="nord"] { --bg: #2e3440; --card: #3b4252; --text: #eceff4; --border: #4c566a; --accent: #88c0d0; --input: #242933; --thought: #3b4252; }
        [data-theme="solarized"] { --bg: #002b36; --card: #073642; --text: #839496; --border: #586e75; --accent: #268bd2; --input: #001e26; --thought: #073642; }

        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; margin:0; }
        nav { background-color: var(--card); border-bottom: 1px solid var(--border); height: 70px; display: flex; align-items: center; padding: 0 2rem; justify-content: space-between; z-index: 100; }
        .app-container { display: flex; height: calc(100vh - 70px); width: 100vw; }
        
        .sidebar-left { width: 280px; border-right: 1px solid var(--border); overflow-y: auto; padding: 1.5rem; flex-shrink: 0; background: var(--bg); transition: width 0.3s; }
        .sidebar-left.collapsed { width: 0; padding: 0; border: none; opacity: 0; pointer-events: none; }
        .main-content { flex: 1; overflow-y: auto; padding: 2rem; background: var(--bg); min-width: 300px; }
        .sidebar-right { width: 420px; min-width: 250px; max-width: 800px; border-left: 1px solid var(--border); overflow-y: auto; padding: 1.5rem; flex-shrink: 0; background: var(--card); }

        .resizer-r { width: 8px; cursor: col-resize; display: flex; align-items: center; justify-content: center; z-index: 50; }
        .resizer-r:hover { background: var(--accent); opacity: 0.3; }
        .resizer-r::after { content: ""; width: 2px; height: 40px; background: var(--border); border-radius: 2px; }

        .thought-block { background: var(--thought); border-left: 4px solid var(--accent); padding: 1rem; margin-bottom: 1.5rem; font-style: italic; font-size: 0.8rem; border-radius: 0 1rem 1rem 0; }
        .q-card { background-color: var(--card); border: 1px solid var(--border); border-radius: 2rem; padding: 2.5rem; margin-bottom: 2rem; }
        .question-stem { white-space: pre-wrap !important; line-height: 1.8; font-size: 1.1rem; font-weight: 700; color: var(--text); }
        
        .option-btn { width: 100%; text-align: left; padding: 1.1rem 1.4rem; border-radius: 1.25rem; border: 1px solid var(--border); background: var(--card); color: var(--text); display: flex; gap: 15px; margin-bottom: 0.75rem; transition: 0.2s; align-items: center; cursor: pointer; }
        .option-btn.correct { background: rgba(16, 185, 129, 0.15) !important; border-color: #10b981 !important; color: #10b981 !important; }
        .option-btn.wrong { background: rgba(244, 63, 94, 0.15) !important; border-color: #f43f5e !important; color: #f43f5e !important; }
        .locked { pointer-events: none !important; opacity: 0.7; }
        
        .label-circle { min-width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 11px; background-color: var(--input); color: var(--accent); }
        
        .ai-config-box { background: var(--input); border: 1px solid var(--border); border-radius: 1.5rem; padding: 1rem; margin-bottom: 1.5rem; }
        select, input { width: 100%; padding: 0.6rem; border-radius: 0.75rem; font-size: 11px; margin-bottom: 0.5rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); appearance: none; outline: none; }
        .prose { color: var(--text) !important; font-size: 14px; max-width: none; }
        .chip { background: var(--input); border: 1px solid var(--border); color: var(--text); opacity: 0.6; cursor: pointer; padding: 0.3rem 0.8rem; border-radius: 2rem; font-size: 10px; font-weight: 700; }
        .chip.active { background: var(--accent) !important; color: white !important; opacity: 1; }
        
        .q-image-preview { max-width: 100%; border-radius: 1rem; margin-top: 1rem; border: 1px solid var(--border); display: none; }

        /* USAGE TRACKER STYLE[cite: 4] */
        .usage-badge { background: var(--thought); border: 1px solid var(--border); border-radius: 1rem; padding: 0.75rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

<nav>
    <div class="flex items-center gap-5">
        <button onclick="toggleLeftSidebar()" class="p-2.5 rounded-xl border border-slate-700/50 text-blue-500"><i id="sidebar-toggle-icon" class="fa-solid fa-indent"></i></button>
        <h1 class="text-xl font-bold uppercase">UPSC <span style="color:var(--accent)">Vault</span></h1>
        <div class="bg-black/20 px-4 py-1.5 rounded-2xl border border-slate-700/30 flex items-center gap-3">
            <span id="timer-display" class="font-mono font-bold" style="color:var(--accent)">00:00:00</span>
            <div class="flex items-center gap-2">
                <button onclick="toggleTimer()" style="color:var(--accent)" title="Play/Pause"><i id="timer-icon" class="fa-solid fa-play"></i></button>
                <button onclick="resetTimer()" style="color:var(--accent)" title="Reset Clock"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <button id="finish-btn" onclick="endMock()" class="hidden bg-emerald-600 text-white px-4 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest">Finish Exam</button>
        <button onclick="cycleTheme()" class="px-4 py-2 rounded-2xl bg-black/20 border border-slate-700/30 text-xs font-bold uppercase tracking-widest"><i class="fa-solid fa-palette mr-2"></i><span id="theme-name">AMOLED</span></button>
        <button onclick="document.getElementById('csv-upload').click()" class="bg-blue-600 text-white px-5 py-2 rounded-3xl text-xs font-bold">Import CSV</button>
        <input type="file" id="csv-upload" accept=".csv" class="hidden" onchange="handleCSVUpload(event)">
    </div>
</nav>

<div class="app-container">
    <aside class="sidebar-left" id="sidebar-left">
        <div class="ai-config-box">
            <h4 class="text-[9px] font-bold mb-2 uppercase" style="color:var(--accent)">Reasoning Intelligence</h4>
            <select id="ai-provider" onchange="updateModels(); localStorage.setItem('v60_provider', this.value)">
                <option value="literouter">LiteRouter (Best Free)</option>
                <option value="groq">Groq (Llama Only)</option>
                <option value="openrouter">OpenRouter</option>
            </select>
            <select id="ai-model" onchange="localStorage.setItem('v60_model', this.value)"></select>
            <input type="password" id="api-key" placeholder="API Key" onchange="localStorage.setItem('v60_key', this.value.trim())">
        </div>

        <!-- SESSION USAGE MONITOR -->
        <div class="usage-badge">
            <h4 class="text-[8px] font-black mb-2 opacity-50 uppercase tracking-widest">Session Spend</h4>
            <div class="flex justify-between text-[11px] font-bold">
                <span>$ <span id="session-cost">0.0000</span></span>
                <span class="opacity-50"><span id="session-tokens">0</span> tokens</span>
            </div>
        </div>

        <div class="mb-8">
            <h4 class="text-[10px] font-black mb-4 uppercase tracking-widest" style="color:var(--accent)">Simulation Tests</h4>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="startMock(1)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 01</button>
                <button onclick="startMock(2)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 02</button>
                <button onclick="startMock(3)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 03</button>
                <button onclick="startMock(4)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 04</button>
                <button onclick="startMock(5)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 05</button>
                <button onclick="startMock(6)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 06</button>
                <button onclick="startMock(7)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 07</button>
                <button onclick="startMock(8)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 08</button>
                <button onclick="startMock(9)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 09</button>
                <button onclick="startMock(10)" class="py-2 text-[9px] border border-slate-700/30 rounded-lg hover:bg-blue-600/20">Test 10</button>
            </div>
        </div>

        <div id="year-chips" class="flex flex-wrap gap-1.5 mb-8"></div>
        <div id="subject-chips" class="flex flex-wrap gap-1.5 mb-8"></div>
        <button onclick="resetFilters()" class="w-full py-3 text-[9px] font-bold opacity-50 border border-dashed rounded-xl uppercase">Reset Filters</button>
    </aside>

    <main class="main-content" id="main-content"><div id="questions-list"></div></main>
    <div class="resizer-r" id="resizer-r"></div>

    <aside class="sidebar-right" id="sidebar-right">
        <div class="flex justify-between items-center mb-5 pb-5 border-b" style="border-color:var(--border)">
            <h2 class="text-[10px] font-black uppercase tracking-widest" style="color:var(--accent)">Reasoning Analysis</h2>
            <button onclick="copyAnalysis()" class="text-[9px] font-bold opacity-50 uppercase">Copy</button>
        </div>
        <div id="ai-content-area"></div>
    </aside>
</div>

<script>
let ALL_QUESTIONS = [], activeYears = [], activeSubjects = [], timerSeconds = 0, timerInterval = null, currentAiText = "";
let isExam = false, marks = 0, correct = 0, wrong = 0, attempted = 0;
let totalTokens = 0, totalCost = 0; // TRACKERS[cite: 4]
const themes = ["amoled", "sepia", "nord", "solarized"];
let currentThemeIdx = 0;
const questionImages = {};

const providerModels = {
    literouter: [
        { name: "DeepSeek R1 (Best Reasoning)", val: "deepseek-r1" },
        { name: "DeepSeek V3", val: "deepseek-v3" },
        { name: "Kimi K2 Thinking", val: "kimi-k2" }
    ],
    openrouter: [
        { name: "DeepSeek R1 (Full)", val: "deepseek/deepseek-r1:free" },
        { name: "Llama 3.3 70B", val: "meta-llama/llama-3.3-70b-instruct:free" }
    ],
    groq: [
        { name: "Llama 3.3 70B Versatile", val: "llama-3.3-70b-versatile" },
        { name: "Llama 3.2 11B Vision", val: "llama-3.2-11b-vision-preview" }
    ]
};

function updateModels() {
    const prov = document.getElementById('ai-provider').value;
    const modelSelect = document.getElementById('ai-model');
    modelSelect.innerHTML = providerModels[prov].map(m => `<option value="${m.val}">${m.name}</option>`).join('');
    const saved = localStorage.getItem('v60_model');
    if (saved) modelSelect.value = saved;
}

function cycleTheme() {
    currentThemeIdx = (currentThemeIdx + 1) % themes.length;
    const t = themes[currentThemeIdx];
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('theme-name').innerText = t.toUpperCase();
}

const resizer = document.getElementById('resizer-r'), sidebarRight = document.getElementById('sidebar-right');
let isResizing = false;
resizer.addEventListener('mousedown', () => isResizing = true);
window.addEventListener('mousemove', (e) => { if (!isResizing) return; const w = document.body.offsetWidth - e.clientX; if (w > 250 && w < 800) sidebarRight.style.width = w + 'px'; });
window.addEventListener('mouseup', () => isResizing = false);

function toggleLeftSidebar() { document.getElementById('sidebar-left').classList.toggle('collapsed'); }

function resetTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    document.getElementById('timer-icon').className = 'fa-solid fa-play';
    timerSeconds = isExam ? (120 * 60) : 0;
    updateTimerUI();
}

function toggleTimer() {
    const icon = document.getElementById('timer-icon');
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; icon.className = 'fa-solid fa-play'; }
    else {
        icon.className = 'fa-solid fa-pause';
        timerInterval = setInterval(() => {
            if (isExam) { timerSeconds--; if (timerSeconds <= 0) endMock(); } 
            else { timerSeconds++; }
            updateTimerUI();
        }, 1000);
    }
}

function startMock(testId) {
    if (ALL_QUESTIONS.length < 20) return alert("Import CSV first.");
    isExam = true; marks = 0; correct = 0; wrong = 0; attempted = 0;
    timerSeconds = 120 * 60;
    document.getElementById('finish-btn').classList.remove('hidden');
    document.getElementById('sidebar-left').classList.add('collapsed');
    const seed = testId * 777;
    const mockSet = [...ALL_QUESTIONS].sort((a,b) => (Math.sin(seed + a.id) - Math.sin(seed + b.id))).slice(0, 100);
    renderQuestions(mockSet);
    resetTimer(); toggleTimer();
}

function updateTimerUI() {
    const h = Math.floor(Math.abs(timerSeconds)/3600).toString().padStart(2, '0');
    const m = Math.floor((Math.abs(timerSeconds)%3600)/60).toString().padStart(2, '0');
    const s = (Math.abs(timerSeconds)%60).toString().padStart(2, '0');
    document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
}

function checkAns(btn, l, ans) {
    attempted++;
    if (l.toLowerCase() === ans) { correct++; marks += 2.0; btn.classList.add('correct'); } 
    else { wrong++; marks -= 0.66; btn.classList.add('wrong'); }
    btn.parentElement.querySelectorAll('button').forEach(b => b.classList.add('locked'));
}

function endMock() {
    clearInterval(timerInterval); timerInterval = null; isExam = false;
    document.getElementById('timer-icon').className = 'fa-solid fa-play';
    document.querySelectorAll('.option-btn').forEach(b => b.classList.add('locked'));
    alert(`EXAM FINISHED\nMarks: ${marks.toFixed(2)}\nCorrect: ${correct}\nWrong: ${wrong}`);
    document.getElementById('finish-btn').classList.add('hidden');
}

function handleCSVUpload(e) {
    Papa.parse(e.target.files[0], {
        header: true, skipEmptyLines: true,
        complete: (r) => {
            ALL_QUESTIONS = r.data.filter(x => x.Question).map((x, i) => ({ id: i, question: x.Question, subject: x.Subject || "General", year: parseInt(x.Year), ans: (x["Official Answer Key"] || "").toLowerCase().trim().replace(/[()]/g, '') }));
            renderFilters(); renderQuestions(ALL_QUESTIONS);
        }
    });
}

function renderFilters() {
    const y = [...new Set(ALL_QUESTIONS.map(q => q.year))].sort((a,b) => b-a);
    const s = [...new Set(ALL_QUESTIONS.map(q => q.subject))].sort();
    document.getElementById("year-chips").innerHTML = y.map(v => `<span onclick="toggleYear(${v}, this)" class="chip ${activeYears.includes(v)?'active':''}">${v}</span>`).join('');
    document.getElementById("subject-chips").innerHTML = s.map(v => `<span onclick="toggleSubject('${v}', this)" class="chip ${activeSubjects.includes(v)?'active':''}">${v}</span>`).join('');
}
function toggleYear(v, el) { activeYears.includes(v) ? activeYears = activeYears.filter(x => x !== v) : activeYears.push(v); renderFilters(); filterQuestions(); }
function toggleSubject(v, el) { activeSubjects.includes(v) ? activeSubjects = activeSubjects.filter(x => x !== v) : activeSubjects.push(v); renderFilters(); filterQuestions(); }
function resetFilters() { activeYears = []; activeSubjects = []; renderFilters(); renderQuestions(ALL_QUESTIONS); }

function filterQuestions() {
    const filtered = ALL_QUESTIONS.filter(q => (activeYears.length === 0 || activeYears.includes(q.year)) && (activeSubjects.length === 0 || activeSubjects.includes(q.subject)));
    renderQuestions(filtered);
}

function handleImageSelect(input, qId) {
    const file = input.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            questionImages[qId] = e.target.result;
            const preview = document.getElementById(`img-prev-${qId}`);
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
}

function renderQuestions(qs) {
    document.getElementById("questions-list").innerHTML = qs.map((q, idx) => {
        const cleanStem = q.question.replace(/^\d+[\.\)\s\-]+/, '').trim();
        const pts = cleanStem.split(/\(([a-d])\)/g);
        let stem = pts[0], opts = [];
        for(let i=1; i<pts.length; i+=2) opts.push({ l: pts[i], t: pts[i+1] });
        
        return `
            <div class="q-card">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex gap-2">
                        <span class="text-[9px] bg-black/10 px-3 py-1 rounded-3xl font-black uppercase">${q.year}</span>
                        <span class="text-[9px] bg-black/10 px-3 py-1 rounded-3xl font-black uppercase">${q.subject}</span>
                    </div>
                    <span class="text-[10px] font-black opacity-30">ARCHIVE MODE</span>
                </div>
                <div class="question-stem mb-10"><span style="color:var(--accent)">${idx + 1}.</span> ${stem}</div>
                <div class="space-y-1">
                    ${opts.map(o => `<button onclick="checkAns(this, '${o.l}', '${q.ans}')" class="option-btn"><span class="label-circle">${o.l.toUpperCase()}</span><span>${o.t}</span></button>`).join('')}
                </div>
                <img id="img-prev-${q.id}" class="q-image-preview">
                <div class="mt-10 pt-6 border-t flex justify-between items-center" style="border-color:var(--border)">
                    <div class="flex gap-4">
                        <button onclick="askR1(${q.id})" class="text-[9px] font-black uppercase" style="color:var(--accent)">Deep R1 Analysis</button>
                        <button onclick="document.getElementById('img-input-${q.id}').click()" class="text-[9px] font-black uppercase opacity-50">Attach Image</button>
                        <input type="file" id="img-input-${q.id}" class="hidden" accept="image/*" onchange="handleImageSelect(this, ${q.id})">
                    </div>
                </div>
            </div>`;
    }).join('');
}

// HYBRID AI + USAGE MONITOR[cite: 3, 4]
async function askR1(idx) {
    if (isExam) return alert("Analysis disabled during exam.");
    const key = (localStorage.getItem('v60_key') || '').trim();
    const provider = document.getElementById('ai-provider').value;
    const model = document.getElementById('ai-model').value;
    const imgData = questionImages[idx];
    if (!key) return alert("API Key Missing.");
    
    const q = ALL_QUESTIONS.find(x => x.id === idx);
    const box = document.getElementById('ai-content-area');
    box.innerHTML = `<div class="mt-20 text-center animate-pulse text-[9px] font-bold uppercase" style="color:var(--accent)">Analyzing Spend...</div>`;
    
    let baseUrl = '';
    if(provider === 'literouter') baseUrl = 'https://api.literouter.com/v1/chat/completions';
    else if(provider === 'groq') baseUrl = 'https://api.groq.com/openai/v1/chat/completions';
    else baseUrl = 'https://openrouter.ai/api/v1/chat/completions';

    const messageContent = [{ type: "text", text: `Analyze conceptual accuracy for Q: ${q.question}\nOfficial Answer: ${q.ans}` }];
    if (imgData) messageContent.push({ type: "image_url", image_url: { url: imgData } });

    try {
        const response = await fetch(baseUrl, {
            method: 'POST',
            headers: { 
                'Authorization': 'Bearer ' + key, 
                'Content-Type': 'application/json', 
                'HTTP-Referer': 'https://upscvault.internal',
                'X-Title': 'UPSC Vault' 
            },
            body: JSON.stringify({ model: model, messages: [{ role: "user", content: messageContent }] })
        });
        if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error?.message || "Connection failed.");
        }
        const data = await response.json();
        
        // TRACK USAGE
        if (data.usage) {
            const usage = data.usage;
            totalTokens += usage.total_tokens;
            // R1 Estimate: $0.14 input / $0.55 output per 1M
            const batchCost = (usage.prompt_tokens * 0.14 / 1000000) + (usage.completion_tokens * 0.55 / 1000000);
            totalCost += batchCost;
            document.getElementById('session-cost').innerText = totalCost.toFixed(4);
            document.getElementById('session-tokens').innerText = totalTokens.toLocaleString();
        }

        currentAiText = data.choices[0].message.content;
        let thought = "", final = currentAiText;
        if (currentAiText.includes("<thought>")) {
            thought = currentAiText.split("<thought>")[1].split("</thought>")[0];
            final = currentAiText.split("</thought>")[1];
        }
        box.innerHTML = `${thought ? `<div class="thought-block">${marked.parse(thought)}</div>` : ''}<div class="ai-render-box prose">${marked.parse(final)}</div>`;
    } catch (err) { 
        box.innerHTML = `<div class="p-4 border border-red-500/30 rounded-xl text-rose-500 text-[10px] uppercase font-bold text-center">AI Error: ${err.message}</div>`; 
    }
}

function copyAnalysis() { if(currentAiText) navigator.clipboard.writeText(currentAiText).then(() => alert("Copied Analysis!")); }

window.onload = () => {
    const t = localStorage.getItem('v58_theme') || 'amoled';
    document.documentElement.setAttribute('data-theme', t);
    if(localStorage.getItem('v60_key')) document.getElementById('api-key').value = localStorage.getItem('v60_key');
    if(localStorage.getItem('v60_provider')) document.getElementById('ai-provider').value = localStorage.getItem('v60_provider');
    updateModels();
};
</script>
</body>
</html>
